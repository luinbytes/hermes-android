name: CI

on:
  workflow_dispatch:
    inputs:
      managed_device_qa_only:
        description: Run managed-device Bot Mode QA after a separately green exact-head PR check
        required: false
        type: boolean
        default: false
  push:
    branches: [main, prerelease, dev]
  pull_request:
    branches: [main, prerelease, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'main-release' || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' || (github.ref != 'refs/heads/main' && github.ref != 'refs/heads/prerelease') }}

permissions:
  contents: read

jobs:
  quality:
    name: Tests and lint
    if: github.event_name != 'workflow_dispatch' || inputs.managed_device_qa_only != true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - run: >-
          ./gradlew --no-daemon --no-parallel --max-workers=2
          :app:testDebugUnitTest :app:lintDebug

  release-plan:
    name: Prepare approval-gated release candidate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_ready: ${{ steps.plan.outputs.release_ready }}
      version: ${{ steps.plan.outputs.version }}
      version_code: ${{ steps.plan.outputs.version_code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Plan release or open candidate PR
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          set_outputs() {
            {
              echo "release_ready=$1"
              echo "version=$2"
              echo "version_code=$3"
            } >> "$GITHUB_OUTPUT"
          }

          create_candidate_pr() {
            body_file="$RUNNER_TEMP/release-candidate.md"
            cat > "$body_file" <<EOF
            Automated release candidate for v$version (versionCode $version_code).

          This PR is intentionally not auto-merged. Review and merge it to approve the signed release.
          EOF
            gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base main \
              --head "$branch" \
              --title "chore(release): v$version" \
              --body-file "$body_file"
          }

          merged_pr_title="$(gh api \
            --header 'Accept: application/vnd.github+json' \
            "/repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
            --jq '.[0].title' 2>/dev/null || true)"
          latest_release_tag="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 20 --json tagName,isLatest --jq 'map(select(.isLatest)) | .[0].tagName' 2>/dev/null || true)"
          latest_release_version=""
          latest_release_code=""
          if [[ "$latest_release_tag" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            latest_release_version="${BASH_REMATCH[1]}"
            latest_release_dir="$RUNNER_TEMP/latest-release"
            mkdir -p "$latest_release_dir"
            gh release download "$latest_release_tag" \
              --repo "$GITHUB_REPOSITORY" \
              --dir "$latest_release_dir" \
              --pattern 'hermes-android-release.provenance.properties'
            latest_release_code="$(sed -n 's/^android.version_code=//p' "$latest_release_dir/hermes-android-release.provenance.properties")"
            [[ "$latest_release_code" =~ ^[1-9][0-9]*$ ]]
          else
            echo "Latest release tag is legacy or absent: ${latest_release_tag:-none}; bootstrapping from repository metadata."
          fi

          current_version="$(python3 scripts/release_version.py current --field name)"
          current_code="$(python3 scripts/release_version.py current --field code)"

          if [[ "$merged_pr_title" =~ ^chore\(release\):[[:space:]]v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            version="$current_version"
            version_code="$current_code"
            test "$version" = "${BASH_REMATCH[1]}"
            if [[ -n "$latest_release_version" ]]; then
              if [[ "$(python3 scripts/release_version.py compare --left "$version" --right "$latest_release_version")" -le 0 ]]; then
                echo "Release candidate v$version is not newer than latest published v$latest_release_version" >&2
                exit 1
              fi
              if [[ "$version_code" -le "$latest_release_code" ]]; then
                echo "Release candidate versionCode $version_code is not newer than latest published versionCode $latest_release_code" >&2
                exit 1
              fi
            fi
            python3 scripts/release_version.py validate
            set_outputs true "$version" "$version_code"
            exit 0
          fi

          bump="$(python3 scripts/release_version.py classify --title "$merged_pr_title")"
          if [[ "$bump" == "none" ]]; then
            echo "No release-worthy change detected; no release candidate will be opened."
            set_outputs false "" ""
            exit 0
          fi

          if [[ -n "$latest_release_version" && "$current_version" != "$latest_release_version" ]]; then
            echo "main version $current_version does not match latest release $latest_release_tag" >&2
            exit 1
          fi
          if [[ -n "$latest_release_code" && "$current_code" -lt "$latest_release_code" ]]; then
            echo "main versionCode $current_code is behind latest published versionCode $latest_release_code" >&2
            exit 1
          fi
          version="$(python3 scripts/release_version.py next --bump "$bump")"
          version_code=$((current_code + 1))
          if [[ -n "$latest_release_version" && "$(python3 scripts/release_version.py compare --left "$version" --right "$latest_release_version")" -le 0 ]]; then
            echo "Candidate v$version is not newer than latest published v$latest_release_version" >&2
            exit 1
          fi
          if [[ -n "$latest_release_code" && "$version_code" -le "$latest_release_code" ]]; then
            echo "Candidate versionCode $version_code is not newer than latest published versionCode $latest_release_code" >&2
            exit 1
          fi
          branch="release/v$version"

          if gh api "/repos/$GITHUB_REPOSITORY/git/ref/heads/$branch" >/dev/null 2>&1; then
            existing_pr="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$branch" --state open --json number,url --jq '.[0] | if . then "#\(.number) \(.url)" else empty end')"
            if [[ -n "$existing_pr" ]]; then
              echo "Release candidate already exists: $existing_pr"
              set_outputs false "$version" "$version_code"
              exit 0
            fi
            echo "Recovering release branch without an open PR: $branch"
            create_candidate_pr
            set_outputs false "$version" "$version_code"
            exit 0
          fi

          git switch --create "$branch"
          python3 scripts/release_version.py bump \
            --version "$version" \
            --version-code "$version_code"
          python3 scripts/release_version.py validate
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/build.gradle.kts app/src/test/java/com/nousresearch/hermes/provenance/BuildProvenanceTest.kt
          git commit -m "chore(release): v$version"
          git push origin "HEAD:$branch"
          create_candidate_pr

          echo "Release candidate opened for $current_version -> $version. Waiting for approval before main/tag/release writes."
          set_outputs false "$version" "$version_code"

  dev-artifacts:
    name: Dev debug APK and AAB
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Restore stable debug keystore
        env:
          HERMES_DEBUG_KEYSTORE_BASE64: ${{ secrets.HERMES_DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$HERMES_DEBUG_KEYSTORE_BASE64"
          mkdir -p "$RUNNER_TEMP/hermes-signing"
          printf '%s' "$HERMES_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/hermes-signing/debug.p12"
          chmod 600 "$RUNNER_TEMP/hermes-signing/debug.p12"
      - name: Build stable debug artifacts
        env:
          HERMES_DEBUG_KEYSTORE_PATH: ${{ runner.temp }}/hermes-signing/debug.p12
          HERMES_DEBUG_KEYSTORE_PASSWORD: ${{ secrets.HERMES_DEBUG_KEYSTORE_PASSWORD }}
          HERMES_DEBUG_KEY_ALIAS: hermes-debug
          HERMES_DEBUG_KEY_PASSWORD: ${{ secrets.HERMES_DEBUG_KEYSTORE_PASSWORD }}
          HERMES_REQUIRE_DEBUG_SIGNING: "true"
        run: ./gradlew --no-daemon -Phermes.provenance.channel=debug :app:writeBuildProvenance :app:assembleDebug :app:bundleDebug
      - name: Sign debug app bundle
        env:
          HERMES_DEBUG_KEYSTORE_PATH: ${{ runner.temp }}/hermes-signing/debug.p12
          HERMES_DEBUG_KEYSTORE_PASSWORD: ${{ secrets.HERMES_DEBUG_KEYSTORE_PASSWORD }}
          HERMES_DEBUG_KEY_PASSWORD: ${{ secrets.HERMES_DEBUG_KEYSTORE_PASSWORD }}
        run: |
          jarsigner \
            -keystore "$HERMES_DEBUG_KEYSTORE_PATH" \
            -storetype PKCS12 \
            -storepass:env HERMES_DEBUG_KEYSTORE_PASSWORD \
            -keypass:env HERMES_DEBUG_KEY_PASSWORD \
            -sigalg SHA384withRSA \
            -digestalg SHA-384 \
            app/build/outputs/bundle/debug/app-debug.aab \
            hermes-debug
      - name: Verify stable debug signatures
        run: |
          set -euo pipefail
          debug_fingerprint="2a46d00222f6d6faf30b86b9fc0647998b25a82a2ba1531c70a84a91bbb1650c"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk | grep -F "$debug_fingerprint"
          keytool -printcert -jarfile app/build/outputs/bundle/debug/app-debug.aab | tr -d ': ' | grep -iF "$debug_fingerprint"
      - uses: actions/upload-artifact@v4
        with:
          name: hermes-android-dev-debug
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/bundle/debug/app-debug.aab
            app/build/generated/provenance/hermes-android-debug.properties
          if-no-files-found: error
          retention-days: 3

  benchmark:
    name: API 36 benchmarks and Baseline Profile
    if: >-
      always() && needs.quality.result == 'success' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'pull_request' && (github.base_ref == 'main' || github.base_ref == 'prerelease')) ||
       (github.event_name == 'push' && github.ref == 'refs/heads/prerelease') ||
       (github.event_name == 'push' && github.ref == 'refs/heads/main' &&
        needs.release-plan.outputs.release_ready == 'true'))
    needs: [quality, release-plan]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Install API 36 benchmark image
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "system-images;android-36;google_apis;x86_64"
      - name: Enable KVM
        run: sudo chmod 666 /dev/kvm
      - name: Run benchmark journeys and generate Baseline Profile
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --no-parallel --max-workers=1 \
            :app:generateBaselineProfile
          if ./gradlew --no-daemon --no-parallel --max-workers=1 \
            :benchmark:pixel6Api36BenchmarkReleaseAndroidTest; then
            exit 0
          fi
          # ponytail: one retry handles managed-device flakes; persistent failures still fail the gate.
          echo "Benchmark instrumentation failed; retrying once with fresh task outputs."
          rm -rf benchmark/build/outputs benchmark/build/test-results
          ./gradlew --no-daemon --no-parallel --max-workers=1 --rerun-tasks \
            :benchmark:pixel6Api36BenchmarkReleaseAndroidTest
      - name: Emit benchmark evidence metadata
        run: |
          set -euo pipefail
          mkdir -p benchmark/build/outputs/hermes-evidence
          for benchmark in \
            coldStartupReportsTtidTtfdAndFrames \
            warmStartupReportsFrames \
            atlasJourney chatContinuousStreamJourney transcriptScrollDuringContinuousStreamJourney \
            composerJourney filesJourney artifactsJourney manageJourney; do
            repetitions=3
            case "$benchmark" in
              coldStartupReportsTtidTtfdAndFrames|warmStartupReportsFrames) repetitions=5 ;;
            esac
            jq -cn \
              --arg benchmark "$benchmark" \
              --arg commit "$GITHUB_SHA" \
              --argjson repetitions "$repetitions" \
              '{benchmark:$benchmark,commit:$commit,device:"pixel6Api36",androidApi:36,toolchain:"AGP 8.9.2 / Gradle 8.11.1",profileState:"baseline-profile",repetitions:$repetitions,environment:{runner:"gmd",workflow:"ci"},metrics:{}}' \
              >> benchmark/build/outputs/hermes-evidence/benchmark-evidence.jsonl
          done
      - name: Stage first benchmark pass
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/hermes-benchmark/run-1"
          cp -R benchmark/build/outputs/managed_device_android_test_additional_output \
            "$RUNNER_TEMP/hermes-benchmark/run-1/"
          mkdir -p "$RUNNER_TEMP/hermes-benchmark/evidence"
          cp benchmark/build/outputs/hermes-evidence/benchmark-evidence.jsonl \
            "$RUNNER_TEMP/hermes-benchmark/evidence/"
      - name: Enforce accepted API 36 benchmark baseline
        id: benchmark-gate
        continue-on-error: true
        run: ./scripts/check-benchmark-regression.sh "$RUNNER_TEMP/hermes-benchmark/run-1" benchmark/accepted-baseline.json
      - name: Confirm benchmark regression with a second managed-device pass
        if: steps.benchmark-gate.outcome == 'failure'
        run: |
          set -euo pipefail
          echo "Initial benchmark sample exceeded the baseline; confirming with a second managed-device pass."
          rm -rf benchmark/build/outputs benchmark/build/test-results
          ./gradlew --no-daemon --no-parallel --max-workers=1 --rerun-tasks \
            :benchmark:pixel6Api36BenchmarkReleaseAndroidTest
          mkdir -p "$RUNNER_TEMP/hermes-benchmark/run-2"
          cp -R benchmark/build/outputs/managed_device_android_test_additional_output \
            "$RUNNER_TEMP/hermes-benchmark/run-2/"
      - name: Enforce accepted API 36 benchmark baseline after confirmation
        if: steps.benchmark-gate.outcome == 'failure'
        run: ./scripts/check-benchmark-regression.sh "$RUNNER_TEMP/hermes-benchmark" benchmark/accepted-baseline.json
      - uses: actions/upload-artifact@v4
        with:
          name: hermes-android-api36-benchmarks
          path: |
            ${{ runner.temp }}/hermes-benchmark/**
            app/src/release/generated/baselineProfiles/**
            benchmark/accepted-baseline.json
          if-no-files-found: error
          retention-days: 14

  device-tests:
    name: API 28 and API 36 app tests
    if: >-
      always() &&
      (needs.quality.result == 'success' ||
       (github.event_name == 'workflow_dispatch' && inputs.managed_device_qa_only)) &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'pull_request' && (github.base_ref == 'main' || github.base_ref == 'prerelease')) ||
       (github.event_name == 'push' && github.ref == 'refs/heads/prerelease') ||
       (github.event_name == 'push' && github.ref == 'refs/heads/main' &&
        needs.release-plan.outputs.release_ready == 'true'))
    needs: [quality, release-plan]
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Install managed-device images
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "system-images;android-28;google_apis;x86_64" "system-images;android-36;google_apis;x86_64"
      - name: Enable KVM
        run: sudo chmod 666 /dev/kvm
      - name: Run Android app matrix
        run: |
          device_tasks=(
            :app:pixel2Api28DebugAndroidTest
            :app:pixel2Api36DebugAndroidTest
            :app:pixelTabletApi36DebugAndroidTest
          )
          qa_args=()
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.managed_device_qa_only }}" == "true" ]]; then
            device_tasks=(
              :app:pixel2Api36DebugAndroidTest
              :app:pixelTabletApi36DebugAndroidTest
            )
            qa_args+=("-Pandroid.testInstrumentationRunnerArguments.class=com.nousresearch.hermes.ui.BotModeManagedDeviceQaTest")
          fi
          ./gradlew --no-daemon --no-parallel --max-workers=1 \
            "${device_tasks[@]}" \
            "${qa_args[@]}"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.managed_device_qa_only }}" == "true" ]]; then
            screenshot_count="$(find app/build/intermediates/managed_device_android_test_additional_output -type f -name 'bot-mode-qa-*.png' | wc -l | tr -d ' ')"
            test "$screenshot_count" -ge 2
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hermes-android-device-test-results
          path: |
            app/build/outputs/androidTest-results/**
            app/build/intermediates/managed_device_android_test_additional_output/**
          if-no-files-found: warn
          retention-days: 14

  candidate-evidence:
    name: Reproducible release candidate
    if: >-
      always() && needs.quality.result == 'success' &&
      ((github.event_name == 'pull_request' && (github.base_ref == 'main' || github.base_ref == 'prerelease')) ||
       (github.event_name == 'push' && github.ref == 'refs/heads/prerelease') ||
       (github.event_name == 'push' && github.ref == 'refs/heads/main' &&
        needs.release-plan.outputs.release_ready == 'true'))
    needs: [quality, release-plan]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "system-images;android-36;google_apis;x86_64"
      - name: Enable KVM
        run: sudo chmod 666 /dev/kvm
      - name: Build first clean unsigned candidate and SBOM
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --no-parallel --max-workers=1 clean \
            -Phermes.provenance.channel=release \
            :app:generateBaselineProfile :app:writeBuildProvenance :app:lintRelease :app:assembleRelease :app:bundleRelease :app:cyclonedxDirectBom
          mkdir -p "$RUNNER_TEMP/hermes-candidate/first"
          cp app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/hermes-candidate/first/hermes-android.apk"
          cp app/build/outputs/bundle/release/app-release.aab "$RUNNER_TEMP/hermes-candidate/first/hermes-android.aab"
          cp app/build/reports/cyclonedx-direct/bom.json "$RUNNER_TEMP/hermes-candidate/first/hermes-android.cdx.json"
          cp app/src/release/generated/baselineProfiles/baseline-prof.txt "$RUNNER_TEMP/hermes-candidate/baseline-prof.txt"
      - name: Build second clean unsigned candidate
        run: |
          set -euo pipefail
          rm -rf app/src/release/generated/baselineProfiles
          mkdir -p app/src/release/generated/baselineProfiles
          cp "$RUNNER_TEMP/hermes-candidate/baseline-prof.txt" app/src/release/generated/baselineProfiles/baseline-prof.txt
          ./gradlew --no-daemon --no-parallel --max-workers=1 --no-build-cache --rerun-tasks clean \
            -Phermes.provenance.channel=release \
            :app:writeBuildProvenance :app:assembleRelease :app:bundleRelease
          mkdir -p "$RUNNER_TEMP/hermes-candidate/second"
          cp app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/hermes-candidate/second/hermes-android.apk"
          cp app/build/outputs/bundle/release/app-release.aab "$RUNNER_TEMP/hermes-candidate/second/hermes-android.aab"
      - name: Compare unsigned payloads and stage evidence
        run: |
          set -euo pipefail
          first="$RUNNER_TEMP/hermes-candidate/first"
          second="$RUNNER_TEMP/hermes-candidate/second"
          ./scripts/compare-android-payloads.sh "$first/hermes-android.apk" "$second/hermes-android.apk"
          ./scripts/compare-android-payloads.sh "$first/hermes-android.aab" "$second/hermes-android.aab"
          evidence="$RUNNER_TEMP/hermes-candidate/evidence"
          mkdir -p "$evidence"
          cp "$second/hermes-android.apk" "$evidence/hermes-android-release-unsigned.apk"
          cp "$second/hermes-android.aab" "$evidence/hermes-android-release-unsigned.aab"
          cp app/build/outputs/mapping/release/mapping.txt "$evidence/hermes-android-release-mapping.txt"
          cp app/build/generated/provenance/hermes-android-release.properties "$evidence/hermes-android-release.provenance.properties"
          cp "$first/hermes-android.cdx.json" "$evidence/hermes-android-release.cdx.json"
          (cd "$evidence" && sha256sum -- * > hermes-android-release.sha256)
      - uses: actions/upload-artifact@v4
        with:
          name: hermes-android-release-candidate-evidence
          path: ${{ runner.temp }}/hermes-candidate/evidence
          if-no-files-found: error
          retention-days: 14

  release-artifacts:
    name: Main release APK and AAB
    if: >-
      always() && github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.release-plan.outputs.release_ready == 'true' &&
      needs.quality.result == 'success' &&
      needs.release-plan.result == 'success' &&
      needs.benchmark.result == 'success' &&
      needs.device-tests.result == 'success' &&
      needs.candidate-evidence.result == 'success'
    needs: [quality, release-plan, benchmark, device-tests, candidate-evidence]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: release
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate release metadata
        id: release-metadata
        run: |
          set -euo pipefail
          python3 scripts/release_version.py validate
          version="$(python3 scripts/release_version.py current --field name)"
          version_code="$(python3 scripts/release_version.py current --field code)"
          {
            echo "version=$version"
            echo "version_code=$version_code"
            echo "tag=v$version"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "system-images;android-36;google_apis;x86_64"
      - name: Enable KVM
        run: sudo chmod 666 /dev/kvm
      - name: Generate release Baseline Profile
        run: ./gradlew --no-daemon --no-parallel --max-workers=1 :app:generateBaselineProfile
      - name: Restore release keystore
        env:
          HERMES_RELEASE_KEYSTORE_BASE64: ${{ secrets.HERMES_RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$HERMES_RELEASE_KEYSTORE_BASE64"
          mkdir -p "$RUNNER_TEMP/hermes-signing"
          printf '%s' "$HERMES_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/hermes-signing/release.p12"
          chmod 600 "$RUNNER_TEMP/hermes-signing/release.p12"
      - name: Build release artifacts
        env:
          HERMES_RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/hermes-signing/release.p12
          HERMES_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.HERMES_RELEASE_KEYSTORE_PASSWORD }}
          HERMES_RELEASE_KEY_ALIAS: hermes-release
          HERMES_RELEASE_KEY_PASSWORD: ${{ secrets.HERMES_RELEASE_KEYSTORE_PASSWORD }}
          HERMES_REQUIRE_RELEASE_SIGNING: "true"
        run: ./gradlew --no-daemon -Phermes.provenance.channel=release :app:writeBuildProvenance :app:assembleRelease :app:bundleRelease :app:cyclonedxDirectBom
      - name: Verify release signatures
        run: |
          set -euo pipefail
          release_fingerprint="3138e711ef881291c1c39495c7b55fe816b4155a97735116bc36a72097dc202d"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk | grep -F "$release_fingerprint"
          keytool -printcert -jarfile app/build/outputs/bundle/release/app-release.aab | tr -d ': ' | grep -iF "$release_fingerprint"
      - name: Stage release downloads
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/hermes-release"
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/hermes-release/hermes-android-release.apk"
          cp app/build/outputs/bundle/release/app-release.aab "$RUNNER_TEMP/hermes-release/hermes-android-release.aab"
          cp app/build/outputs/mapping/release/mapping.txt "$RUNNER_TEMP/hermes-release/hermes-android-release-mapping.txt"
          cp app/build/generated/provenance/hermes-android-release.properties "$RUNNER_TEMP/hermes-release/hermes-android-release.provenance.properties"
          cp app/build/reports/cyclonedx-direct/bom.json "$RUNNER_TEMP/hermes-release/hermes-android-release.cdx.json"
          cd "$RUNNER_TEMP/hermes-release"
          sha256sum hermes-android-release.apk hermes-android-release.aab hermes-android-release-mapping.txt hermes-android-release.provenance.properties hermes-android-release.cdx.json > hermes-android-release.sha256
      - name: Verify release metadata and checksums
        env:
          RELEASE_VERSION: ${{ steps.release-metadata.outputs.version }}
          RELEASE_VERSION_CODE: ${{ steps.release-metadata.outputs.version_code }}
        run: |
          set -euo pipefail
          release_dir="$RUNNER_TEMP/hermes-release"
          cd "$release_dir"
          sha256sum --check hermes-android-release.sha256
          grep -Fx "android.version=$RELEASE_VERSION" hermes-android-release.provenance.properties
          grep -Fx "android.version_code=$RELEASE_VERSION_CODE" hermes-android-release.provenance.properties
          grep -Fx "android.channel=release" hermes-android-release.provenance.properties
          grep -Fx "android.commit=$GITHUB_SHA" hermes-android-release.provenance.properties
          grep -Fx "build.package=com.nousresearch.hermes" hermes-android-release.provenance.properties
          grep -Fx "build.signing_fingerprint=sha256:3138e711ef881291c1c39495c7b55fe816b4155a97735116bc36a72097dc202d" hermes-android-release.provenance.properties
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging hermes-android-release.apk | \
            grep -F "package: name='com.nousresearch.hermes' versionCode='$RELEASE_VERSION_CODE' versionName='$RELEASE_VERSION'"
      - name: Attest release provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: ${{ runner.temp }}/hermes-release/*
      - name: Publish latest release downloads
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.release-metadata.outputs.version }}
          RELEASE_VERSION_CODE: ${{ steps.release-metadata.outputs.version_code }}
        run: |
          set -euo pipefail
          release_tag="v$RELEASE_VERSION"
          release_dir="$RUNNER_TEMP/hermes-release"
          release_files=(
            "$release_dir/hermes-android-release.apk"
            "$release_dir/hermes-android-release.aab"
            "$release_dir/hermes-android-release-mapping.txt"
            "$release_dir/hermes-android-release.provenance.properties"
            "$release_dir/hermes-android-release.cdx.json"
            "$release_dir/hermes-android-release.sha256"
          )

          notes_file="$release_dir/hermes-android-release-notes.md"
          {
            echo "Signed Hermes Android $RELEASE_VERSION release built from main at $GITHUB_SHA."
            echo
            echo "Android versionCode: $RELEASE_VERSION_CODE"
            echo
            echo "Build provenance:"
            echo
            echo '```properties'
            cat "$release_dir/hermes-android-release.provenance.properties"
            echo '```'
          } > "$notes_file"

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

          latest_release_tag="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 20 --json tagName,isLatest --jq 'map(select(.isLatest)) | .[0].tagName' 2>/dev/null || true)"
          if [[ "$latest_release_tag" != "$release_tag" && "$latest_release_tag" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            latest_release_version="${BASH_REMATCH[1]}"
            if [[ "$(python3 scripts/release_version.py compare --left "$RELEASE_VERSION" --right "$latest_release_version")" -le 0 ]]; then
              echo "Release v$RELEASE_VERSION is stale; latest published release is v$latest_release_version" >&2
              exit 1
            fi
            latest_release_dir="$RUNNER_TEMP/latest-release"
            mkdir -p "$latest_release_dir"
            gh release download "$latest_release_tag" \
              --repo "$GITHUB_REPOSITORY" \
              --dir "$latest_release_dir" \
              --pattern 'hermes-android-release.provenance.properties'
            latest_release_code="$(sed -n 's/^android.version_code=//p' "$latest_release_dir/hermes-android-release.provenance.properties")"
            [[ "$latest_release_code" =~ ^[1-9][0-9]*$ ]]
            if [[ "$RELEASE_VERSION_CODE" -le "$latest_release_code" ]]; then
              echo "Release versionCode $RELEASE_VERSION_CODE is stale; latest published versionCode is $latest_release_code" >&2
              exit 1
            fi
          fi

          remote_tag_sha="$(git ls-remote origin "refs/tags/$release_tag^{}" | awk 'NR == 1 {print $1}')"
          if [[ -z "$remote_tag_sha" ]]; then
            remote_tag_sha="$(git ls-remote origin "refs/tags/$release_tag" | awk 'NR == 1 {print $1}')"
          fi
          if [[ -n "$remote_tag_sha" ]]; then
            test "$remote_tag_sha" = "$GITHUB_SHA"
            echo "Release tag already points to $GITHUB_SHA: $release_tag"
          else
            git tag --annotate "$release_tag" "$GITHUB_SHA" --message "Hermes Android $RELEASE_VERSION"
            git push origin "$release_tag"
          fi

          if release_is_draft="$(gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft' 2>/dev/null)"; then
            if [[ "$release_is_draft" == "true" ]]; then
              gh release upload "$release_tag" "${release_files[@]}" --clobber --repo "$GITHUB_REPOSITORY"
            else
              echo "Release $release_tag is already public; preserving its assets for verification."
            fi
          else
            release_is_draft=true
            gh release create "$release_tag" "${release_files[@]}" \
              --draft \
              --verify-tag \
              --target "$GITHUB_SHA" \
              --title "Hermes Android $RELEASE_VERSION" \
              --notes-file "$notes_file" \
              --repo "$GITHUB_REPOSITORY"
          fi

          public_dir="$RUNNER_TEMP/hermes-public-release"
          mkdir -p "$public_dir"
          gh release download "$release_tag" \
            --repo "$GITHUB_REPOSITORY" \
            --dir "$public_dir" \
            --pattern 'hermes-android-release*'
          (
            cd "$public_dir"
            sha256sum --check hermes-android-release.sha256
            grep -Fx "android.version=$RELEASE_VERSION" hermes-android-release.provenance.properties
            grep -Fx "android.version_code=$RELEASE_VERSION_CODE" hermes-android-release.provenance.properties
            grep -Fx "android.commit=$GITHUB_SHA" hermes-android-release.provenance.properties
          )
          if [[ "$release_is_draft" == "true" ]]; then
            gh release edit "$release_tag" --draft=false --latest --repo "$GITHUB_REPOSITORY"
          fi
